<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <meta name="theme-color" content="#0e0e0e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="Static Radar" />
  <title></title>
  <script>
    (function () {
      var titles = [
        "Advanced Analytics Dashboard",
        "Real-Time Performance Monitor",
        "System Status Tracker",
        "Interactive Data Visualization",
        "Network Intelligence Platform",
        "Enterprise Monitoring Solution",
        "Real-Time Analytics Suite",
        "Performance Metrics Dashboard"
      ];
      document.title = titles[Math.floor(Math.random() * titles.length)];
    })();
  </script>
  <link rel="icon" href="./favicon.ico" />
  <link rel="apple-touch-icon" href="./assets/app.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Sora:wght@400;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./css/radar-base.css" />
  <link rel="stylesheet" href="./css/app.css" />
</head>
<body>
  <div id="hidden-box"></div>

  <div id="pwdGate" class="pwd hidden">
    <div class="pwd-atmosphere" aria-hidden="true"></div>
    <div class="pwd-container">
      <div class="pwd-header">
        <img class="pwd-brand" src="./assets/app.png" alt="Shubao" />
        <div class="pwd-brand-name">Shubao</div>
        <div class="pwd-brand-tag">Radar</div>
        <p class="pwd-lead">输入访问密码以继续</p>
      </div>
      <div class="pwd-content">
        <div class="pwd-input-group" id="pwdBoxes"></div>
        <input id="pwdInput" class="pwd-input" maxlength="8" autocomplete="off" inputmode="numeric" aria-label="访问密码" />
        <button id="pwdConfirm" class="pwd-confirm-btn" type="button">确认进入</button>
        <div class="pwd-status">密码请联系管理员获取，演示密码1111</div>
      </div>
    </div>
  </div>

  <div id="pwdError" class="pwd-error-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="pwdErrorTitle">
    <div class="pwd-error-card">
      <div class="pwd-error-icon" aria-hidden="true">!</div>
      <div class="pwd-error-title" id="pwdErrorTitle">密码错误</div>
      <p class="pwd-error-desc">访问密码不正确，请重新输入</p>
      <button id="pwdErrorOk" class="pwd-error-btn" type="button">重新输入</button>
    </div>
  </div>

  <div id="app" class="app hidden">
    <canvas id="mapCanvas"></canvas>

    <div class="ping-stats">
      <div class="ping-item players-count">
        <span class="value" id="playerCountBadge">0</span>
        <span class="label">在线玩家</span>
      </div>
      <div class="ping-item ping-display">
        <span class="value ping-good" id="pingBadge">0ms</span>
        <span class="label">延迟</span>
      </div>
      <div class="ping-item">
        <span class="value ping-good" id="modeBadge">LIVE</span>
        <span class="label">模式</span>
      </div>
    </div>

    <div id="timeoutWarn" class="timeout-warning-container" hidden>
      <div class="timeout-warning-content">
        <span class="icon">⚠</span>
        数据超时<small>STATIC</small>
      </div>
    </div>

    <div class="floor-selector-vertical" id="floorSelector"></div>

    <div class="item-box-container" id="itemBoxContainer" hidden>
      <div class="item-box" id="itemBox"></div>
    </div>

    <aside class="player-lists" id="playerLists">
      <div class="player-lists-header">
        <h3>玩家列表</h3>
        <span class="player-count" id="playerListCount">0</span>
      </div>
      <div class="player-lists-content" id="playerListContent"></div>
    </aside>

    <div class="gui">
      <div class="gui-bottom">
        <div class="camera-button" id="cameraBtn">
          <div class="hero" id="cameraHero"></div>
          <div class="value" id="cameraLabel">自由視角</div>
          <div class="icon" id="cameraIcon">▴</div>
          <div class="lists" id="cameraLists"></div>
        </div>
        <div class="settings-button" id="settingsBtn" title="设置">
          <span class="icon">⚙</span>
        </div>
      </div>
    </div>

    <button class="player-list-settings-button" id="togglePlayerList" type="button" title="玩家列表">
      <span class="icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" xmlns="http://www.w3.org/2000/svg">
          <path fill-rule="evenodd" d="M16.67 13.13C18.04 14.06 19 15.32 19 17v3h4v-3c0-2.18-3.57-3.47-6.33-3.87z"/>
          <circle cx="9" cy="8" r="4" fill-rule="evenodd"/>
          <path fill-rule="evenodd" d="M15 12c2.21 0 4-1.79 4-4s-1.79-4-4-4c-.47 0-.91.1-1.33.24C14.5 5.27 15 6.58 15 8s-.5 2.73-1.33 3.76c.42.14.86.24 1.33.24zm-6 1c-2.67 0-8 1.34-8 4v3h16v-3c0-2.66-5.33-4-8-4z"/>
        </svg>
      </span>
    </button>

    <div class="fps" id="fpsLabel">60 FPS</div>
  </div>

  <div class="setting-mark" id="settingMark"></div>
  <div class="setting" id="settingPanel">
    <div class="setting-header">
      <div class="setting-header-left">
        <img class="setting-header-logo" src="./assets/app.png" alt="logo" width="24" height="24" />
        <span class="setting-header-title">设置</span>
        <span class="setting-header-subtitle">Shubao TEAM</span>
      </div>
      <div class="setting-header-right">
        <div class="setting-header-menus" id="topMenus">
          <div class="setting-header-menu-item active" data-group="user">基础</div>
          <div class="setting-header-menu-item" data-group="points">点位</div>
          <div class="setting-header-menu-item" data-group="item">物资</div>
          <div class="setting-header-menu-item" data-group="containers">容器</div>
          <div class="setting-header-menu-item" data-group="about">关于</div>
        </div>
        <div class="setting-header-close" id="settingClose">完成</div>
      </div>
    </div>

    <div class="setting-content-container">
      <div class="setting-content show" data-panel="user">
        <div class="user-container">
          <div class="my-masonry-grid" id="userCards"></div>
        </div>
      </div>
      <div class="setting-content" data-panel="item">
        <div class="item-container" id="itemPanel"></div>
      </div>
      <div class="setting-content" data-panel="containers">
        <div class="containers" id="containerPanel"></div>
      </div>
      <div class="setting-content" data-panel="points">
        <div class="point-container">
          <div class="my-masonry-grid" id="pointCards"></div>
        </div>
      </div>
      <div class="setting-content" data-panel="about">
        <div class="about">
          <img class="about-logo" src="./assets/app.png" alt="Shubao_Radar" />
          <div class="about-name">Shubao_Radar</div>
          <div class="about-version">v 1.0.0</div>
          <div class="about-desc">Powered by Bc</div>
          <div class="about-contact">
            <a class="about-link primary" href="#">Shubao官方群</a>
            <button class="about-link" type="button" id="resetSettings">重置设置</button>
          </div>
        </div>
      </div>
    </div>

    <div class="setting-tab" id="bottomTabs" hidden></div>
  </div>

  <div id="bootScreen" class="ui-screen-content">
    <div class="ui-screen-content-box">
      <div class="ui-loader"><div class="loader"></div></div>
      <div class="ui-title">Shubao_Radar</div>
      <div class="ui-desc" id="bootText">正在加载…</div>
    </div>
  </div>

  <script src="./js/data.js"></script>
  <script src="./js/maps-config.js"></script>
  <script src="./js/item-categories.js"></script>
  <script src="./js/sample-items.js"></script>
  <script src="./js/sample-containers.js"></script>
  <script src="./js/sample-weapons.js"></script>
  <script src="./js/map-areas.js"></script>
  <script src="./js/assets.js"></script>
  <script src="./js/app.js"></script>
</body>
</html>
